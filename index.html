<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Responsividade para celulares, tablets e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>João Hugo</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           PÁGINA
        ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
        }


        /* =====================================================
           ÁREA DA IMAGEM
        ===================================================== */

        .tela {

            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #000;
        }


        /* =====================================================
           IMAGEM
        ===================================================== */

        .imagem {

            /*
             * A imagem pode ocupar no máximo
             * o tamanho da tela.
             */
            max-width: 100%;
            max-height: 100%;

            /*
             * Mantém a proporção original.
             */
            width: auto;
            height: auto;

            /*
             * NÃO corta a imagem.
             */
            object-fit: contain;

            /*
             * Mantém a imagem centralizada.
             */
            object-position: center;

            /*
             * Remove pequenos espaços
             * causados pelo comportamento inline.
             */
            display: block;
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 768px) {

            .tela {
                width: 100vw;
                height: 100vh;
            }

            .imagem {

                max-width: 100vw;
                max-height: 100vh;

                width: auto;
                height: auto;

                object-fit: contain;
            }
        }


        /* =====================================================
           CELULAR EM MODO PAISAGEM
        ===================================================== */

        @media (max-height: 500px) {

            .imagem {

                max-width: 100vw;
                max-height: 100vh;

                width: auto;
                height: auto;
            }
        }

    </style>

</head>


<body>

    <main class="tela">

        <!--
            Coloque sua imagem na mesma pasta
            deste arquivo e altere o nome abaixo.
        -->

        <img
            class="imagem"
            src="Lista de presente joao.jpeg"
            alt="Imagem principal"
        >

    </main>

</body>

</html>
