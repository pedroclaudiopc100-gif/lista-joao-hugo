<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =====================================================
         CONFIGURAÇÕES BÁSICAS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lista do João</title>


    <!-- =====================================================
         CONFIGURAÇÕES DE COMPARTILHAMENTO
         WhatsApp / Facebook / outras redes sociais
    ====================================================== -->

    <meta property="og:type"
          content="website">

    <meta property="og:title"
          content="Lista do João">

    <meta property="og:description"
          content="Confira a Lista do João">

    <meta property="og:url"
          content="https://pedroclaudiopc100-gif.github.io/lista-joao-hugo/">

    <meta property="og:image"
          content="https://raw.githubusercontent.com/pedroclaudiopc100-gif/lista-joao-hugo/main/Lista%20de%20presente%20joao.jpeg">

    <meta property="og:image:alt"
          content="Lista do João">


    <!-- =====================================================
         CONFIGURAÇÕES PARA TWITTER / X
    ====================================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Lista do João">

    <meta name="twitter:description"
          content="Confira a Lista do João">

    <meta name="twitter:image"
          content="https://raw.githubusercontent.com/pedroclaudiopc100-gif/lista-joao-hugo/main/Lista%20de%20presente%20joao.jpeg">


    <!-- =====================================================
         ESTILO DA PÁGINA
    ====================================================== -->

    <style>

        /* -----------------------------------------------------
           RESET
        ----------------------------------------------------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* -----------------------------------------------------
           HTML E BODY
        ----------------------------------------------------- */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;
        }


        /* -----------------------------------------------------
           ÁREA PRINCIPAL
        ----------------------------------------------------- */

        .tela {

            width: 100%;
            height: 100vh;

            /*
             * dvh funciona melhor em celulares,
             * principalmente quando a barra do navegador
             * aparece ou desaparece.
             */
            height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #000;
        }


        /* -----------------------------------------------------
           IMAGEM
        ----------------------------------------------------- */

        .imagem {

            /*
             * A imagem nunca poderá ultrapassar
             * os limites da tela.
             */
            max-width: 100%;
            max-height: 100%;

            /*
             * Mantém a proporção original.
             */
            width: auto;
            height: auto;

            /*
             * NÃO corta nenhuma parte da imagem.
             */
            object-fit: contain;

            /*
             * Mantém a imagem perfeitamente centralizada.
             */
            object-position: center center;

            /*
             * Remove espaços adicionais do elemento.
             */
            display: block;

            /*
             * Impede comportamento estranho
             * de seleção da imagem.
             */
            user-select: none;

            /*
             * Evita arrastar a imagem
             * acidentalmente no celular.
             */
            -webkit-user-drag: none;
        }


        /* =====================================================
           CELULAR
        ====================================================== */

        @media (max-width: 768px) {

            .tela {

                width: 100%;
                height: 100vh;
                height: 100dvh;

                display: flex;

                justify-content: center;
                align-items: center;

                overflow: hidden;
            }

            .imagem {

                max-width: 100vw;
                max-height: 100vh;
                max-height: 100dvh;

                width: auto;
                height: auto;

                object-fit: contain;

                object-position: center center;
            }
        }


        /* =====================================================
           CELULAR DEITADO / PAISAGEM
        ====================================================== */

        @media (orientation: landscape) {

            .imagem {

                max-width: 100vw;

                max-height: 100vh;
                max-height: 100dvh;

                width: auto;
                height: auto;

                object-fit: contain;

                object-position: center center;
            }
        }

    </style>

</head>


<body>

    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="tela">

        <img
            class="imagem"
            src="https://raw.githubusercontent.com/pedroclaudiopc100-gif/lista-joao-hugo/main/Lista%20de%20presente%20joao.jpeg"
            alt="Lista do João"
        >

    </main>


</body>

</html>
