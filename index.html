<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Responsividade para celular, tablet e computador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome da página -->
    <title>Lista do João</title>

    <!-- Informações exibidas ao compartilhar o link -->
    <meta property="og:title" content="Lista do João">
    <meta property="og:description" content="Confira a Lista do João">
    <meta property="og:type" content="website">

    <!--
        COLOQUE AQUI O LINK DA SUA IMAGEM
        Exemplo:
        https://raw.githubusercontent.com/usuario/repositorio/main/imagem.png
    -->
    <meta property="og:image"
        content="https://raw.githubusercontent.com/pedroclaudiopc100-gif/lista-joao-hugo/refs/heads/main/Lista%20de%20presente%20joao.jpeg">


    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           PÁGINA
        ============================== */

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;
        }


        /* ==============================
           ÁREA DA TELA
        ============================== */

        .tela {

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #000;
        }


        /* ==============================
           IMAGEM
        ============================== */

        .imagem {

            /*
             * Nunca ultrapassa os limites
             * da tela.
             */
            max-width: 100%;
            max-height: 100%;

            /*
             * Mantém a proporção original
             * da imagem.
             */
            width: auto;
            height: auto;

            /*
             * NÃO corta nenhuma parte
             * da imagem.
             */
            object-fit: contain;

            /*
             * Mantém a imagem centralizada.
             */
            object-position: center;

            display: block;
        }


        /* ==============================
           CELULAR
        ============================== */

        @media (max-width: 768px) {

            .tela {
                width: 100%;
                height: 100vh;
                height: 100dvh;

                display: flex;

                justify-content: center;
                align-items: center;
            }

            .imagem {

                max-width: 100%;
                max-height: 100%;

                width: auto;
                height: auto;

                object-fit: contain;

                object-position: center;
            }
        }


        /* ==============================
           CELULAR DEITADO
        ============================== */

        @media (orientation: landscape) {

            .imagem {

                max-width: 100vw;
                max-height: 100vh;
                max-height: 100dvh;

                width: auto;
                height: auto;

                object-fit: contain;

                object-position: center;
            }
        }

    </style>

</head>


<body>

    <main class="tela">

        <!--
            ==================================================
            COLOQUE AQUI O LINK DA SUA IMAGEM
            ==================================================

            Exemplo:

            src="https://raw.githubusercontent.com/
            usuario/repositorio/main/imagem.png"
        -->

        <img
            class="imagem"
            src="https://raw.githubusercontent.com/pedroclaudiopc100-gif/lista-joao-hugo/refs/heads/main/Lista%20de%20presente%20joao.jpeg"
            alt="Lista do João"
        >

    </main>

</body>

</html>
